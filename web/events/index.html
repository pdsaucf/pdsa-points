<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Events | PDSA UCF</title>
    <meta name="description" content="Upcoming PDSA UCF events: date, time, location and how to sign up." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#59328f" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../assets/img/pdsa-emblem-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/img/pdsa-emblem-256.png" />
    <link rel="stylesheet" href="../assets/css/events.css" />
    <link rel="stylesheet" href="../assets/css/public.css" />
  </head>
  <body>
    <!--
      TOUCHES NO TABLE (invariant 3). This page calls portal_events() and
      nothing else: no name typed, no login, no personalization. /me already
      answers "what did I attend"; this page answers "what is happening".
    -->
    <main id="app" class="app">
      <p class="brand-row">
        <img
          class="emblem"
          src="../assets/img/pdsa-emblem-96.png"
          width="40"
          height="40"
          decoding="async"
          alt=""
        />
        <a class="brand-link" href="../me/">Points</a>
      </p>

      <h1 class="title">Events</h1>

      <div id="screen-message" class="message" role="alert" hidden>
        <p id="screen-message-title" class="message-title"></p>
        <p id="screen-message-body" class="message-body"></p>
        <button id="screen-message-action" type="button" class="button button-secondary" hidden></button>
      </div>

      <section id="loading" class="view-centred" aria-busy="true">
        <p class="spinner" aria-hidden="true"></p>
      </section>

      <section id="empty" class="events-empty" hidden>
        <h2 class="title">Nothing coming up</h2>
      </section>

      <div id="event-groups" class="event-groups" hidden></div>

      <noscript>
        <p class="body">This page needs JavaScript. Turn it on, or ask an officer what is coming up.</p>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <nav class="footer-links" aria-label="PDSA links">
          <a
            class="footer-link"
            href="https://www.tiktok.com/@ucf_pdsa"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
            title="TikTok"
            data-icon="tiktok"
          >
            <svg class="footer-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.72-.03-.5-.04-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.08-.14 1.62.24 1.64 1.82 3.02 3.5 2.87 1.11-.01 2.17-.66 2.75-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z" fill="currentColor" stroke="none" />
            </svg>
          </a>
          <a
            class="footer-link"
            href="https://www.instagram.com/ucf_pdsa/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            title="Instagram"
            data-icon="instagram"
          >
            <svg class="footer-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
          </a>
          <a
            class="footer-link"
            href="https://pdsaucf.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Main Website"
            title="Main Website"
            data-icon="globe"
          >
            <svg class="footer-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M2 12h20" />
              <path d="M12 2a15.3 15.3 0 0 1 0 20" />
              <path d="M12 2a15.3 15.3 0 0 0 0 20" />
            </svg>
          </a>
          <a
            class="footer-link"
            href="mailto:pdsa.ucf@gmail.com"
            aria-label="Contact"
            title="Contact"
            data-icon="mail"
          >
            <svg class="footer-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
          </a>
        </nav>
        <p class="footer-meta">© <span id="footer-year">2026</span> Pre-Dental Student Association at UCF</p>
        <p class="footer-meta">PDSA Points website originally built by Benjamin Le</p>
      </div>
    </footer>

    <nav class="policy-links" aria-label="Site information">
      <a href="/me/">View points</a>
      <a href="/privacy/">Privacy policy</a>
      <a href="/terms/">Terms of use</a>
      <a href="mailto:pdsa.ucf@gmail.com">Contact</a>
    </nav>

    <p id="live" class="visually-hidden" aria-live="polite" role="status"></p>

    <script type="module">
      import { start } from '../src/events-page.js';
      start();
    </script>
  </body>
</html>
