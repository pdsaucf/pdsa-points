<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>My points | PDSA UCF</title>
    <meta name="description" content="Your PDSA UCF points and the Honorary Member requirements." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#59328f" />
    <meta name="robots" content="noindex" />
    <!--
      Members open this on a phone and some of them will pin it, so it gets the
      home screen icon as well as the tab one.
    -->
    <link rel="icon" href="../assets/img/pdsa-emblem-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/img/pdsa-emblem-256.png" />
    <link rel="stylesheet" href="../assets/css/portal.css" />
  </head>
  <body>
    <!--
      THERE IS NO SIGN-IN ON THIS PAGE. A member types their name and reads
      their points. The club has no email addresses for its members and is not
      collecting any, so the magic link, the account, and the claim an officer
      used to confirm are all gone (migration 21).

      Everything here is served by four SECURITY DEFINER functions any visitor
      may call, and every one of them answers with club-facing figures only: no
      address, no student id, no individual check-ins, nothing pending.
    -->
    <main id="app" class="app">
      <!--
        The emblem sits above everything, including the refusals, so somebody
        who followed a link from a group chat can tell whose page this is.
        The club is named in the page title, so the image itself carries no
        alt.
      -->
      <p class="brand-row">
        <img
          class="emblem"
          src="../assets/img/pdsa-emblem-96.png"
          width="40"
          height="40"
          decoding="async"
          alt=""
        />
      </p>

      <nav class="tabs" aria-label="Sections">
        <button id="tab-points" type="button" class="tab" aria-selected="true" aria-controls="view-points">
          My points
        </button>
        <button id="tab-board" type="button" class="tab" aria-selected="false" aria-controls="view-board">
          Club Leaderboard
        </button>
      </nav>

      <!-- Anything that went wrong, for every view below. -->
      <div id="screen-message" class="message" role="alert" hidden>
        <p id="screen-message-title" class="message-title"></p>
        <p id="screen-message-body" class="message-body"></p>
        <button id="screen-message-action" type="button" class="button button-secondary" hidden></button>
      </div>

      <section id="view-points" class="view">
        <!-- The whole sign-in this page has. -->
        <form id="lookup-form" class="panel" novalidate>
          <h1 class="title">Your points</h1>
          <section class="field">
            <label class="label" for="lookup-first">First name</label>
            <input
              id="lookup-first"
              class="input"
              type="text"
              autocomplete="given-name"
              autocapitalize="words"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="next"
            />
            <label class="label" for="lookup-last">Last name</label>
            <input
              id="lookup-last"
              class="input"
              type="text"
              autocomplete="family-name"
              autocapitalize="words"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="go"
            />
            <p id="lookup-error" class="error" role="alert" hidden></p>
            <button id="lookup-submit" type="submit" class="button button-primary full">
              <span id="lookup-submit-label">Show my points</span>
            </button>
          </section>
        </form>

        <!--
          Two members with one name. With no address on file the join month is
          the only thing that tells them apart, so it is what the buttons carry.
        -->
        <section id="pick-block" class="panel" hidden aria-labelledby="pick-title">
          <h2 id="pick-title" class="panel-title">Which one is you?</h2>
          <ul id="pick-list" class="results"></ul>
        </section>

        <section id="scorecard" class="panel" hidden aria-labelledby="score-name">
          <div class="progress-head">
            <h1 id="score-name" class="title"></h1>
            <p id="score-figures" class="figures"></p>
          </div>
          <p id="score-state" class="state" hidden></p>
          <ul id="score-list" class="checklist"></ul>
          <p id="score-points" class="points"></p>
          <button id="score-change" type="button" class="button button-quiet">Not you?</button>
        </section>

        <!--
          Every event of the year and what this member did about each one, from
          portal_attendance(). Drawn under the scorecard and loaded after it, so
          the figures never wait on the list. A category they have a record in
          opens; one they have never been to stays shut.
        -->
        <section id="history" class="panel history" hidden aria-labelledby="history-title">
          <h2 id="history-title" class="panel-title">Your events</h2>
          <div id="history-list" class="event-groups"></div>
        </section>

        <!--
          What the requirements are, for somebody who has not looked themselves
          up. Drawn from the published rules, so it cannot drift from what the
          scorecard above is scored against.
        -->
        <section id="honorary" class="honorary" aria-labelledby="honorary-title">
          <h2 id="honorary-title" class="honorary-title">What is an Honorary Member?</h2>
          <p class="honorary-body">
            Honorary Members are those who go above and beyond to be an active and valuable
            member to PDSA. To reach Honorary Member status, certain requirements must be met.
          </p>
          <ul id="honorary-list" class="honorary-list"></ul>
          <p id="honorary-note" class="muted small" hidden></p>
        </section>
      </section>

      <section id="view-board" class="view" hidden aria-labelledby="board-title">
        <div class="progress-head">
          <h1 id="board-title" class="title">Leaderboard</h1>
          <p id="board-meta" class="muted small"></p>
        </div>
        <section id="board-loading" class="view-centred" aria-busy="true">
          <p class="spinner" aria-hidden="true"></p>
        </section>
        <ol id="board-list" class="board-list"></ol>
      </section>

      <noscript>
        <p class="body">
          This page needs JavaScript. Turn it on, or ask an officer for your points.
        </p>
      </noscript>
    </main>

    <p id="live" class="visually-hidden" aria-live="polite" role="status"></p>

    <script type="module">
      import { start } from '../src/portal.js';
      start();
    </script>
  </body>
</html>
