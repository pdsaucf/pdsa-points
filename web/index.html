<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDSA UCF</title>
    <meta name="robots" content="noindex" />
    <!--
      Somebody who types the bare address wants their points, so the root goes
      to the member portal. A QR code carries the token on /c/ already, but a
      link that lost its path still has ?e= in it, and that one belongs at
      check-in rather than the portal.
    -->
    <script>
      var search = window.location.search;
      window.location.replace(/[?&]e=/.test(search) ? '/c/' + search : '/me/');
    </script>
  </head>
  <body>
    <p><a href="/me/">Continue</a></p>
  </body>
</html>
